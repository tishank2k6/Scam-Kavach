version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: scamshield-postgres
    restart: always
    environment:
      POSTGRES_USER: scamshield
      POSTGRES_PASSWORD: scamshield_secret
      POSTGRES_DB: scamshield
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scamshield -d scamshield"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scamshield-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://scamshield:scamshield_secret@db:5432/scamshield
      - ENVIRONMENT=production
      - RATE_LIMIT_PER_MINUTE=60
      - LLM_PROVIDER=none
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scamshield-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
